name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

# go.mod requires go >= 1.26.0 (toolchain go1.26.4). GOTOOLCHAIN=auto lets every
# `go` invocation auto-fetch that toolchain even though the runner's setup-go
# "stable" currently resolves to 1.25.10.
env:
  GOTOOLCHAIN: auto

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Compile gate (blocking): main must always build on Linux.
      - name: Build
        run: go build ./cmd/... ./pkg/... ./internal/... ./grpc/...

      # Lint + vulncheck run for visibility but are advisory until the lint
      # backlog is triaged (lint had never run on main before this workflow).
      - name: Lint (advisory)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Vulncheck (advisory)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # NOTE: `go test ./...` is intentionally NOT run in CI yet. The suite is
      # Chromium-gated and many browser tests fail (not skip) without a browser,
      # so a Linux runner with no Chromium reds out the whole job. Making CI run
      # the suite needs a Chromium install + proper t.Skip gating of the
      # browser-dependent tests (the "Tests & Coverage" GA item in
      # docs/quality/MATURITY-2026-06-04.md). Tests run locally with Chromium.
