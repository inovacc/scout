name: Test

on:
  push:
  pull_request:

permissions:
  contents: read

# go.mod requires go >= 1.26.0 (toolchain go1.26.4). GOTOOLCHAIN=auto lets every
# `go` invocation auto-fetch that toolchain even though the runner's setup-go
# "stable" currently resolves to 1.25.10.
env:
  GOTOOLCHAIN: auto

jobs:
  quality-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          check-latest: true

      # Compile gate (blocking): main must always build on Linux.
      - name: Build
        run: go build ./cmd/... ./pkg/... ./internal/... ./grpc/...

      # Unit-test run (advisory for now): -short skips most Chromium-dependent
      # tests (newTestBrowser / newOwnedTestBrowser / TestWithRemoteCDP skip under
      # testing.Short()), but a few browser E2E tests still aren't gated and the
      # shared-browser fixture has an isolation bug (closing it breaks later
      # tests), so the suite isn't reliably green headless yet. Advisory until
      # that's fixed (see the Tests/Coverage GA item); still emits coverage.
      - name: Test (-short, advisory)
        continue-on-error: true
        run: |
          go test -short -covermode=atomic -coverprofile=coverage.out ./cmd/... ./pkg/... ./internal/... ./grpc/...
          {
            echo "### Coverage (-short)"
            echo '```'
            go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Lint (advisory)
        continue-on-error: true
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest

      - name: Vulncheck (advisory)
        continue-on-error: true
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # NOTE: the FULL browser suite (without -short) needs a Chromium install in
      # CI + a coverage threshold — tracked as the Tests/Coverage GA item in
      # docs/quality/MATURITY-2026-06-04.md.
